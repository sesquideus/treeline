[project]
name = "treeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.6",
    "django-map-widgets>=0.5.2",
    "geopy>=2.4.1",
    "django-cairn>=0.1.4",
    "psycopg2-binary>=2.9.12",
    "python-decouple>=3.8",
    "pytz>=2026.2",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=6.3.0",
    # An embeddable JS engine, so the tests can run the popup builders in static/js/map.js
    # instead of asserting on their source. See mountains/test_js_runtime.py.
    "quickjs>=1.19.4",
]
