[project]
name = "treeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.6",
    "django-map-widgets>=0.5.2",
    "geopy>=2.4.1",
    "psycopg2-binary>=2.9.12",
    "python-decouple>=3.8",
    "pytz>=2026.2",
]

[dependency-groups]
dev = [
    "django-cairn>=0.1.0",
    "django-debug-toolbar>=6.3.0",
]

[tool.uv.sources]
django-cairn = { path = "../python/django-cairn", editable = true }
