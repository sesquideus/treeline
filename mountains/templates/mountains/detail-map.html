<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="origin">
  <title>{{ summit.point.name }} — Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@9/ol.css">
  <style>
    html, body, #map { height: 100%; margin: 0; }
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/ol@9/dist/ol.js"></script>
<script>
const geojson = {{ geojson|safe }};

const SEGMENTS = 20;
const GREEN  = [39, 174, 96];
const YELLOW = [241, 196, 15];
const PURPLE = [142, 68, 173];
const ORANGE = [230, 126, 34];
const BLUE   = [52, 152, 219];

function interpolateColor(c1, c2, t) {
  return `rgb(${Math.round(c1[0]+(c2[0]-c1[0])*t)},${Math.round(c1[1]+(c2[1]-c1[1])*t)},${Math.round(c1[2]+(c2[2]-c1[2])*t)})`;
}

function denseCoords(coords) {
  const dense = [];
  for (let i = 0; i < coords.length - 1; i++) {
    for (let s = 0; s < SEGMENTS; s++) {
      const t = s / SEGMENTS;
      dense.push([
        coords[i][0] + (coords[i+1][0] - coords[i][0]) * t,
        coords[i][1] + (coords[i+1][1] - coords[i][1]) * t,
      ]);
    }
  }
  dense.push(coords[coords.length - 1]);
  return dense;
}

function segmentStyles(coords, c1, c2) {
  return coords.slice(0, -1).map((_, i) => new ol.style.Style({
    geometry: new ol.geom.LineString([coords[i], coords[i+1]]),
    stroke: new ol.style.Stroke({
      color: interpolateColor(c1, c2, i / (coords.length - 2)),
      width: 4,
    })
  }));
}

const dot = (color, radius=6) => new ol.style.Style({
  image: new ol.style.Circle({
    radius,
    fill: new ol.style.Fill({ color }),
    stroke: new ol.style.Stroke({ color: '#fff', width: 1.5 }),
  })
});

const circleStyle = new ol.style.Style({
  stroke: new ol.style.Stroke({ color: 'rgba(52,152,219,0.6)', width: 1.5, lineDash: [6, 4] }),
  fill:   new ol.style.Fill({ color: 'rgba(52,152,219,0.06)' }),
});

function styleFor(feature) {
  switch (feature.get('type')) {
    case 'summit':              return dot('#c0392b', 8);
    case 'isolation_point':     return dot('#f1c40f');
    case 'isolation_parent':    return dot('#8e44ad');
    case 'col':                 return dot('#27ae60');
    case 'prominence_parent':   return dot('#2980b9');
    case 'encirclement_parent': return dot('#e67e22');
    case 'isolation_circle':    return circleStyle;
    case 'isolation_line_first':
      return segmentStyles(denseCoords(feature.getGeometry().getCoordinates()), GREEN, YELLOW);
    case 'isolation_line_second':
      return segmentStyles(denseCoords(feature.getGeometry().getCoordinates()), YELLOW, PURPLE);
    case 'prominence_line':
      return segmentStyles(denseCoords(feature.getGeometry().getCoordinates()), GREEN, BLUE);
    case 'encirclement_line':
      return [new ol.style.Style({
        stroke: new ol.style.Stroke({ color: 'rgba(230,126,34,0.8)', width: 3, lineDash: [8, 5] })
      })];
    default: return [];
  }
}

const vectorLayer = new ol.layer.Vector({
  source: new ol.source.Vector({
    features: new ol.format.GeoJSON().readFeatures(geojson, {
      featureProjection: 'EPSG:3857',
    }),
  }),
  style: styleFor,
});

const map = new ol.Map({
  target: 'map',
  layers: [
    new ol.layer.Tile({ source: new ol.source.OSM() }),
    vectorLayer,
  ],
  view: new ol.View({ center: ol.proj.fromLonLat([10, 47]), zoom: 6 }),
});

vectorLayer.getSource().once('change', function() {
  const extent = vectorLayer.getSource().getExtent();
  if (extent && isFinite(extent[0])) {
    map.getView().fit(extent, { padding: [60, 60, 60, 60] });
  }
});

const popup = document.createElement('div');
popup.style.cssText = 'background:#fff;padding:6px 10px;border-radius:4px;font:14px sans-serif;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,0.3);';
document.body.appendChild(popup);
const overlay = new ol.Overlay({ element: popup, positioning: 'bottom-center', offset: [0, -10] });
map.addOverlay(overlay);

map.on('click', function(e) {
  const feature = map.forEachFeatureAtPixel(e.pixel, f => f);
  if (feature && feature.get('name')) {
    overlay.setPosition(e.coordinate);
    popup.textContent = feature.get('name');
  } else {
    overlay.setPosition(undefined);
  }
});
</script>
</body>
</html>
