{% load cairn tree %}

{# Only ever included where `sep_col` is known: the section around it is guarded already. #}
<tr>
    <td class="link">
        {% object_link summit 'mountain' attr='name' %}
    </td>
    <td class="altitude">
        {{ summit.point.altitude|subtract:sep_col.point.altitude|diff_altitude }}
    </td>
    <td class="distance">
        {{ summit.point|distance_to:sep_col.point|floatformat:3 }}
    </td>
</tr>
