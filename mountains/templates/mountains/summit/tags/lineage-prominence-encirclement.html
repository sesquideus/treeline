{% load tree %}

{% with ep=node.compute_encirclement_parent %}
    {% if ep %}
        <li>
            <a href="{{ ep.get_absolute_url }}">{{ ep }}</a> ({{ node.prominence|floatformat:1 }} m)
        </li>
        {% render_encirclement_lineage ep %}
    {% else %}
        (unknown) ({{ node.prominence|floatformat:1 }} m)
    {% endif %}
{% endwith %}
