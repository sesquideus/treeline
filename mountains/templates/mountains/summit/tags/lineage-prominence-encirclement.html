{% load tree %}

{% if node.encirclement_parent %}
    <li>
        <a href="{{ node.encirclement_parent.get_absolute_url }}">{{ node.encirclement_parent }}</a> ({{ node.prominence|floatformat:1 }} m)
    </li>
    {% render_encirclement_lineage node.encirclement_parent %}
{% else %}
    (unknown) ({{ node.prominence|floatformat:1 }} m)
{% endif %}
