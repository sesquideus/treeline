{% load static %}

<div class="header">
    {% comment %}{% include 'mountains/logo.svg' %}{% endcomment %}
    <nav>
        {% for item in main_menu %}
            <a href="{% url item.url_name %}"
               class="{% if request.resolver_match.url_name == item.url_name %}active {% endif %}{{ item.cls }}">
                {{ item.label }}
            </a>
      {% endfor %}
    </nav>
</div>
